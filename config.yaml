active_dataset: KITTI_00

# ===================== Dataset Configuration =====================
dataset_config:
  KITTI_00:
    image_path: "./Dataset/KITTI/sequences/00/image_00/"

    image_X: 1241
    image_Y: 376

    FOV_HORI_DEGREE: 81.60
    FOV_VERT_DEGREE: 29.32

    ODO_TRANS_V_SCALE: 75.0                # Translation velocity scaling factor
    ODO_YAW_ROT_V_SCALE: 0.49              # Rotation velocity scaling factor
    ODO_HEIGHT_V_SCALE: 5.0                # Height velocity scaling factor
    MAX_TRANS_V_THRESHOLD: 3.9             # Maximum translation velocity threshold
    MAX_YAW_ROT_V_THRESHOLD: 3.0           # Maximum rotation velocity threshold
    MAX_HEIGHT_V_THRESHOLD: 0.4            # Maximum height velocity threshold

    ODO_SHIFT_MATCH_VERT: 30               # Vertical matching shift range
    ODO_SHIFT_MATCH_HORI: 50               # Horizontal matching shift range

    ODO_IMG_TRANS_RESIZE_RANGE: [94, 310]      # Translation velocity image resize range
    ODO_IMG_YAW_ROT_RESIZE_RANGE: [94, 310]    # Rotation velocity image resize range
    ODO_IMG_HEIGHT_V_RESIZE_RANGE: [94, 310]   # Height velocity image resize range


    # ROI cropping range ([start, end])
    ODO_IMG_TRANS_Y_RANGE: [ 50, 333 ]
    ODO_IMG_TRANS_X_RANGE: [ 200, 1000 ]
    ODO_IMG_YAW_ROT_Y_RANGE: [ 100, 300 ]
    ODO_IMG_YAW_ROT_X_RANGE: [ 350, 850 ]
    ODO_IMG_HEIGHT_V_Y_RANGE: [ 100, 333 ]
    ODO_IMG_HEIGHT_V_X_RANGE: [ 200, 1000 ]

    ## Visual template cropping range
    VT_IMG_CROP_X_RANGE: [0, 1241]
    VT_IMG_CROP_Y_RANGE : [0, 376]
    VT_IMG_RESIZE_X_RANGE: 48              # Resized X dimension
    VT_IMG_RESIZE_Y_RANGE: 30              # Resized Y dimension


  KITTI_07:
    image_path: "./Dataset/KITTI/sequences/07/image_00/"

    image_X: 1226
    image_Y: 370

    FOV_HORI_DEGREE: 81.84
    FOV_VERT_DEGREE: 29.32

    ODO_TRANS_V_SCALE: 55.1                # Translation velocity scaling factor
    ODO_YAW_ROT_V_SCALE: 0.48              # Rotation velocity scaling factor
    ODO_HEIGHT_V_SCALE: 5.0                # Height velocity scaling factor

    MAX_TRANS_V_THRESHOLD: 4.1             # Maximum translation velocity threshold
    MAX_YAW_ROT_V_THRESHOLD: 3.0           # Maximum rotation velocity threshold
    MAX_HEIGHT_V_THRESHOLD: 0.4            # Maximum height velocity threshold

    ODO_SHIFT_MATCH_VERT: 30               # Vertical matching shift range
    ODO_SHIFT_MATCH_HORI: 50               # Horizontal matching shift range

    ODO_IMG_TRANS_RESIZE_RANGE: [ 92, 306 ]     # Translation velocity image resize range
    ODO_IMG_YAW_ROT_RESIZE_RANGE: [ 92, 306 ]   # Rotation velocity image resize range
    ODO_IMG_HEIGHT_V_RESIZE_RANGE: [ 92, 306 ]  # Height velocity image resize range

    # ROI cropping range ([start, end])
    ODO_IMG_TRANS_Y_RANGE: [ 50, 333 ]
    ODO_IMG_TRANS_X_RANGE: [ 200, 1000 ]
    ODO_IMG_YAW_ROT_Y_RANGE: [ 100, 300 ]
    ODO_IMG_YAW_ROT_X_RANGE: [ 350, 850 ]
    ODO_IMG_HEIGHT_V_Y_RANGE: [ 100, 333 ]
    ODO_IMG_HEIGHT_V_X_RANGE: [ 200, 1000 ]

    ## Visual template cropping range
    VT_IMG_CROP_X_RANGE: [0, 1226]
    VT_IMG_CROP_Y_RANGE : [0, 370]

    VT_IMG_RESIZE_X_RANGE: 48              # Resized X dimension
    VT_IMG_RESIZE_Y_RANGE: 30              # Resized Y dimension


  CUSTOM:
    image_path: "./Dataset/Self_collected/"
    image_X: 320
    image_Y: 180
    FOV_HORI_DEGREE: 109.0
    FOV_VERT_DEGREE: 60.0
    ODO_YAW_ROT_V_SCALE: 1.0
    VT_IMG_CROP_X_RANGE: [0, 320]
    n_steps: 2


# ===================== Runtime Configuration =====================
process_config:
  startFrame: 0          # Start frame index
  endFrame: null         # End frame index (null means process all frames)
  VT_STEP: 1             # Visual template update step size


# ===================== Output Configuration =====================
output_config:
  save_results: true                     # Whether to save results
  results_path: "./results/"             # Results save path